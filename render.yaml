services:
  - type: web
    name: sydex-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build -w @sydex/shared && npm run build -w @sydex/server
    startCommand: npm run start -w @sydex/server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sydex-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: EMAIL_OTP_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: OTP_TTL_SECONDS
        value: "300"

  - type: keyvalue
    name: sydex-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off
